# ==============================================================================
# LOA INVOICE ENGINE - Despliegue en Render (Infrastructure as Code)
# ==============================================================================
# Servicio WEB (no cron): el endpoint de eventos debe estar siempre escuchando.
#
# Cargar las variables marcadas con `sync: false` en el panel de Render
# (Environment). Ningun secreto vive en este archivo.
# ==============================================================================

services:
  - type: web
    name: loa-invoice-engine
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: npm run serve
    healthCheckPath: /salud
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"

      # --- Interruptor general (ACTIVADO EN PRODUCCIÓN) ---
      - key: INVOICE_PDF_ENABLED
        value: "true"

      # --- vTiger (webservice, SOLO LECTURA) ---
      - key: VTIGER_URL
        value: https://ventascallcenter.com
      - key: VTIGER_USERNAME
        sync: false
      - key: VTIGER_ACCESS_KEY
        sync: false
      - key: VTIGER_WEB_USERNAME
        sync: false
      - key: VTIGER_WEB_PASSWORD
        sync: false
      - key: INVOICE_PDF_SOURCE
        value: vtiger
      - key: INVOICE_PDF_FALLBACK_PROPIO
        value: "false"

      # --- GHL Cuenta Empresa ---
      - key: GHL_API_KEY_CENTRAL
        sync: false
      - key: GHL_LOCATION_ID_CENTRAL
        sync: false
      - key: GHL_BASE_URL
        value: https://services.leadconnectorhq.com

      # --- Envio Automatico de SMS (PROHIBIDO: Gobernanza exclusiva de GHL Workflow) ---
      - key: INVOICE_AUTO_SEND_SMS
        value: "false"
      - key: INVOICE_SMS_FROM_NUMBER
        value: "+17868828446"

      # --- Disparador hibrido y escaneo autonomo continuo ---
      - key: INVOICE_TRIGGER
        value: hibrido
      - key: INVOICE_SCAN_INTERVAL_MINUTES
        value: "5"
      - key: INVOICE_WEBHOOK_TOKEN
        sync: false
      - key: INVOICE_SCAN_SEDE
        value: TODAS
      - key: INVOICE_ESTADO_COMPRA
        value: VENDIDO
      - key: INVOICE_TRIGGER_STATUS
        value: "VERIFICADA,ENVIADA"
      - key: INVOICE_FECHA_MINIMA
        value: "HOY"
      - key: INVOICE_SOLO_HOY
        value: "true"
      - key: INVOICE_MIN_AMOUNT
        value: "1.00"
      - key: INVOICE_ALLOWED_SUBJECTS
        value: VENTA

      # --- Dominio de Marca para Facturas ---
      - key: INVOICE_SHORT_DOMAIN
        value: https://facturas.labnaturales.com
      - key: INVOICE_LINKS_PATH
        value: data/links.json

      # --- Estado persistente (el cursor vive en data/cursor.json) ---
      - key: INVOICE_CURSOR_PATH
        value: data/cursor.json
      - key: INVOICE_LOG_DIR
        value: data/logs
      - key: INVOICE_PIPELINE_PATH
        value: data/pipeline.jsonl

# Disco persistente: sin el, el cursor se pierde en cada deploy (no es critico:
# el campo `Factura Nº Orden` de GHL sigue evitando duplicados, pero se pierde
# el historial local y la auditoria).
# Descomentar si el plan lo permite:
#
# disks:
#   - name: loa-invoice-data
#     mountPath: /var/data
#     sizeGB: 1
